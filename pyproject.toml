[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevangelion"
version = "0.1.0"
description = "JEV Prompt Compiler: gate, compiler, plan lint, round runtime, policy and synthesis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jev-bench = "jev.eval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jev = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
